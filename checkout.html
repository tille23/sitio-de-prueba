<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - EcoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-leaf me-2"></i>EcoMarket</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Finalizar Compra</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">Información de Envío</h4>
                    </div>
                    <div class="card-body">
                        <form id="checkout-form">
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Dirección</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label">País</label>
                                    <select class="form-select" required>
                                        <option value="">Elegir...</option>
                                        <option>Perú</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Ciudad</label>
                                    <select class="form-select" required>
                                        <option value="">Elegir...</option>
                                        <option>Lima</option>
                                        <option>Arequipa</option>
                                        <option>Cusco</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Código Postal</label>
                                    <input type="text" class="form-control" required>
                                </div>
                            </div>

                            <hr class="my-4">

                            <h4 class="mb-3">Método de Pago</h4>
                            <div class="my-3">
                                <div class="form-check">
                                    <input id="credit" name="paymentMethod" type="radio" class="form-check-input"
                                        checked required>
                                    <label class="form-check-label" for="credit">Tarjeta de Crédito/Débito</label>
                                </div>
                                <div class="form-check">
                                    <input id="yape" name="paymentMethod" type="radio" class="form-check-input"
                                        required>
                                    <label class="form-check-label" for="yape">Yape</label>
                                </div>
                                <div class="form-check">
                                    <input id="paypal" name="paymentMethod" type="radio" class="form-check-input"
                                        required>
                                    <label class="form-check-label" for="paypal">PayPal</label>
                                </div>
                            </div>

                            <div id="card-details" class="row gy-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre en la tarjeta</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Número de tarjeta</label>
                                    <input type="text" class="form-control" placeholder="0000 0000 0000 0000" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Vencimiento</label>
                                    <input type="text" class="form-control" placeholder="MM/YY" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">CVV</label>
                                    <input type="text" class="form-control" placeholder="123" required>
                                </div>
                            </div>

                            <hr class="my-4">

                            <button class="w-100 btn btn-primary btn-lg" type="submit">Pagar y Finalizar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-primary">Tu Carrito</span>
                            <span class="badge bg-primary rounded-pill" id="checkout-count">0</span>
                        </h4>
                        <ul class="list-group mb-3" id="checkout-cart-list">
                            <!-- Items -->
                        </ul>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Total (USD)</span>
                            <strong id="checkout-total">$0.00</strong>
                        </li>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Auth check
        if (!auth.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        // Render mini cart
        const cart = getCart();
        const list = document.getElementById('checkout-cart-list');
        const countBadge = document.getElementById('checkout-count');
        const totalEl = document.getElementById('checkout-total');

        let total = 0;
        let count = 0;

        cart.forEach(item => {
            total += item.price * item.quantity;
            count += item.quantity;
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between lh-sm';
            li.innerHTML = `
                <div>
                    <h6 class="my-0">${item.name}</h6>
                    <small class="text-muted">Cantidad: ${item.quantity}</small>
                </div>
                <span class="text-muted">$${(item.price * item.quantity).toFixed(2)}</span>
            `;
            list.appendChild(li);
        });

        countBadge.textContent = count;
        totalEl.textContent = `$${total.toFixed(2)}`;

        // Toggle card details
        const radios = document.querySelectorAll('input[name="paymentMethod"]');
        const cardDetails = document.getElementById('card-details');

        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.id === 'credit') {
                    cardDetails.style.display = 'flex';
                    cardDetails.querySelectorAll('input').forEach(i => i.required = true);
                } else {
                    cardDetails.style.display = 'none';
                    cardDetails.querySelectorAll('input').forEach(i => i.required = false);
                }
            });
        });

        // Form Submit
        document.getElementById('checkout-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('¡Pago realizado con éxito! Gracias por tu compra.');
            clearCart();
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
