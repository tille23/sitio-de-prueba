<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - EcoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-leaf me-2"></i>EcoMarket</a>
            <div class="d-flex align-items-center">
                <a href="cart.html" class="btn btn-outline-dark me-2 position-relative">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        id="cart-count">0</span>
                </a>
                <div id="auth-buttons"></div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Tu Carrito de Compras</h2>
        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Cantidad</th>
                                        <th>Total</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="cart-items">
                                    <!-- Items rendered via JS -->
                                </tbody>
                            </table>
                        </div>
                        <div id="empty-cart-msg" class="text-center py-4 d-none">
                            <h4>Tu carrito está vacío</h4>
                            <a href="products.html" class="btn btn-primary mt-3">Ir a Comprar</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4>Resumen del Pedido</h4>
                        <hr>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Subtotal:</span>
                            <span id="cart-subtotal">$0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Envío:</span>
                            <span>Gratis</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <strong>Total:</strong>
                            <strong id="cart-total" class="text-primary">$0.00</strong>
                        </div>
                        <button onclick="proceedToCheckout()" class="btn btn-success w-100 btn-lg">Proceder al
                            Pago</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/cart.js"></script>
    <script>
        function renderCart() {
            const cart = getCart();
            const tbody = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');

            tbody.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                emptyMsg.classList.remove('d-none');
                tbody.parentElement.classList.add('d-none');
            } else {
                emptyMsg.classList.add('d-none');
                tbody.parentElement.classList.remove('d-none');

                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="d-flex align-items-center">
                                <img src="${item.image}" alt="${item.name}" style="width: 50px; height: 50px; object-fit: cover; margin-right: 10px;">
                                <span>${item.name}</span>
                            </div>
                        </td>
                        <td>$${item.price}</td>
                        <td>
                            <div class="input-group input-group-sm" style="width: 100px;">
                                <button class="btn btn-outline-secondary" onclick="updateQuantity('${item.id}', -1)">-</button>
                                <input type="text" class="form-control text-center" value="${item.quantity}" readonly>
                                <button class="btn btn-outline-secondary" onclick="updateQuantity('${item.id}', 1)">+</button>
                            </div>
                        </td>
                        <td>$${itemTotal.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="removeFromCart('${item.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            subtotalEl.textContent = `$${total.toFixed(2)}`;
            totalEl.textContent = `$${total.toFixed(2)}`;
        }

        function proceedToCheckout() {
            const cart = getCart();
            if (cart.length === 0) {
                alert('Tu carrito está vacío.');
                return;
            }
            if (!auth.checkAuth()) return;
            window.location.href = 'checkout.html';
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>

</html>
